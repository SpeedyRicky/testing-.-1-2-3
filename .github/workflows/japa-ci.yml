# Japa: The Great Escape — CI/CD
# Every push/PR: lint, typecheck, unit + stress tests, balance simulation, web build, offline single-file build.
# Tags v* (or a manual run): also builds a shrunk, signed Android App Bundle (.aab) for Google Play.
name: Japa CI

on:
  push:
    paths: ["japa-web/**", ".github/workflows/japa-ci.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["japa-web/**"]
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android App Bundle"
        type: boolean
        default: true

defaults:
  run:
    working-directory: japa-web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: japa-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run simulate
      - run: npm run build
      - run: npm run standalone
      - uses: actions/upload-artifact@v4
        with:
          name: japa-offline-html
          path: japa-web/out/japa-standalone.html

  android:
    needs: web
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: japa-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:sync
      - name: Decode the upload keystore (secrets: ANDROID_KEYSTORE_BASE64 and passwords)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Enforce the 50 MB budget
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(stat -c%s "$AAB"); echo "Bundle size: $((SIZE/1024)) KB"
          test "$SIZE" -lt 52428800
      - uses: actions/upload-artifact@v4
        with:
          name: japa-android-aab
          path: japa-web/android/app/build/outputs/bundle/release/app-release.aab
