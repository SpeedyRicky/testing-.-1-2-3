# Japa: The Great Escape — city maps from OpenStreetMap
# Fetches roads, water, rail and real hotspots for every city from the Overpass API, simplifies them into small
# drawings (japa-web/game/maps/data/*.json) and commits them to the branch. Runs when the map builder or the city
# list changes, or by hand. Map data © OpenStreetMap contributors (ODbL).
name: Japa maps

on:
  push:
    branches: ["**"]
    paths: ["japa-web/scripts/maps/**", "japa-web/game/maps/cities.ts", "japa-web/game/maps/geo.ts", ".github/workflows/japa-maps.yml"]
  workflow_dispatch:
    inputs:
      cities:
        description: "City ids, space-separated (empty = every city still missing)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the map already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: japa-maps-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: japa-web

jobs:
  build-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the maps in batches, committing each batch
        env:
          CITIES: ${{ github.event.inputs.cities }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          git config user.name "japa-maps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          todo=$(node --experimental-strip-types scripts/maps/build-maps.ts --list $FORCE $CITIES 2>/dev/null)
          echo "To build: ${todo:-nothing}"
          set -- $todo
          while [ $# -gt 0 ]; do
            batch="$1 $2 $3 $4 $5 $6"; shift $(( $# < 6 ? $# : 6 ))
            node --experimental-strip-types scripts/maps/build-maps.ts $FORCE $batch || echo "::warning::batch failed: $batch"
            git add game/maps/data
            if ! git diff --cached --quiet; then
              git commit -m "Maps: $batch (OpenStreetMap, ODbL)"
              for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
            fi
          done
          missing=$(node --experimental-strip-types scripts/maps/build-maps.ts --list 2>/dev/null)
          if [ -n "$missing" ]; then echo "::warning::Still missing: $missing (run the workflow again to resume)"; fi
