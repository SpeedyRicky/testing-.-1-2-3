name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  tests:
    name: Godot tests and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (headless)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      # A fresh checkout has no .godot cache, so class names (PassageParser, IeltsGame, ...)
      # do not resolve until Godot has imported the project once.
      - name: Import project
        run: godot --headless --path . --import

      # `godot -s` exits non-zero when a check fails. Fixed here: part 1's pipeline
      # never ran any tests before exporting.
      - name: Unit tests (logic, narrative, save, fuzzing)
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: UI smoke test (real scene, real autoloads)
        run: godot --headless --path . -s res://tests/smoke_ui.gd

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend reference tests
        working-directory: backend
        run: |
          npm ci || npm install
          npm test

  # UNTESTED starting point. Run manually (workflow_dispatch) once you have:
  #   1. created an Android preset in the editor (Project > Export) and committed
  #      export_presets.cfg WITHOUT any passwords or keys in it,
  #   2. installed the Android build template (Project > Install Android Build Template)
  #      and committed android/build, which AAB export needs,
  #   3. added secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_USER, ANDROID_KEYSTORE_PASSWORD.
  # Keep the keystore OUT of the project folder: anything under res:// can be packed into the game.
  export_android:
    name: Export signed Android bundle (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Point Godot at the Android SDK and JDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Decode keystore (outside the project folder)
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/japa.aab

      - uses: actions/upload-artifact@v4
        with:
          name: japa-aab
          path: build/japa.aab
          retention-days: 7
